<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8FD8FF" />
  <title>율무의 해바라기씨앗 찾아 떠나기</title>
  <style>
    :root {
      --sky: #8FD8FF;
      --sky-deep: #4DB8EF;
      --cream: #FFFDF0;
      --gold: #F3B83F;
      --brown: #6F3E1E;
      --dark: #17233E;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(90deg, rgba(255,255,255,.22) 2px, transparent 2px),
        linear-gradient(rgba(255,255,255,.22) 2px, transparent 2px),
        var(--sky);
      background-size: 34px 34px;
      color: var(--dark);
      font-family: "DungGeunMo", "NeoDunggeunmo", "Malgun Gothic", monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .game-shell {
      width: min(100%, 900px);
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--brown);
      font-size: clamp(21px, 4vw, 35px);
      line-height: 1.2;
      text-shadow:
        3px 0 #FFF,
        -3px 0 #FFF,
        0 3px #FFF,
        0 -3px #FFF,
        5px 5px 0 #F6C843;
    }

    .subtitle {
      margin: 0 0 14px;
      color: #4D4A46;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .06em;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 8 / 3;
      overflow: hidden;
      border: 8px solid #FFF;
      outline: 5px solid var(--gold);
      border-radius: 8px;
      background: var(--sky);
      box-shadow:
        0 10px 0 rgba(86, 54, 27, .22),
        0 20px 36px rgba(60, 91, 120, .26);
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: manipulation;
    }

    .help {
      margin: 16px 0 0;
      color: #4A4036;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.7;
    }

    .key {
      display: inline-block;
      min-width: 70px;
      padding: 5px 10px 4px;
      border: 2px solid var(--brown);
      border-bottom-width: 5px;
      border-radius: 6px;
      background: #FFF;
      color: var(--brown);
      font-weight: 900;
      transform: translateY(-1px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>율무의 해바라기씨앗 찾아 떠나기</h1>
    <p class="subtitle">PIXEL HAMSTER ARCADE MINI-GAME</p>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas
        id="game"
        width="800"
        height="300"
        aria-label="율무의 해바라기씨앗 무한 달리기 게임"
      ></canvas>
      <button id="restartA11y" class="sr-only" type="button">게임 다시 시작</button>
    </div>

    <p class="help">
      <span class="key">SPACE</span> 점프 · 모바일은 게임 화면 탭 · 해바라기씨앗 +10점 · 전원선은 점프!
    </p>
  </main>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const canvasWrap = document.getElementById("canvasWrap");
    const restartA11y = document.getElementById("restartA11y");

    const W = canvas.width;
    const H = canvas.height;
    const GROUND_Y = 238;

    ctx.imageSmoothingEnabled = false;

    const C = {
      sky: "#8FD8FF",
      sky2: "#72C9F6",
      skyGrid: "#CFEFFF",
      cloud: "#F8FDFF",
      cream: "#FFFDF0",
      gold: "#F3B83F",
      goldDark: "#C77918",
      brown: "#6F3E1E",
      dark: "#17233E",
      navy: "#273550",
      pink: "#F5A4AA",
      pinkLight: "#FFD0D1",
      fur: "#FFF0C3",
      furLight: "#FFF8DB",
      furShadow: "#EBCB92",
      white: "#FFFFFF",
      grey: "#BCC3CE",
      greyDark: "#616A78",
      red: "#E94848",
      green: "#69A942",
      green2: "#9BCB57",
      grassDark: "#46792F",
      soil: "#AF7244",
      soilDark: "#7C4E2D",
      soilLight: "#D79A61",
      seed: "#2D2522",
      seedLight: "#F2E3CC"
    };

    const state = {
      mode: "ready",
      frame: 0,
      score: 0,
      best: Number(localStorage.getItem("yulmuRunnerBest") || 0),
      speed: 3.65,
      spawnTimer: 80,
      objects: [],
      particles: [],
      lastTime: 0,
      shake: 0,
      lastSpawnWasCable: false,
      lives: 3,
      invincible: 0,
      hitFlash: 0
    };

    const player = {
      x: 95,
      y: GROUND_Y - 58,
      w: 86,
      h: 58,
      vy: 0,
      grounded: true
    };

    const restartButton = {
      x: W / 2 - 108,
      y: 187,
      w: 216,
      h: 52
    };

    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }

    function beep(freq, duration, type = "square", volume = 0.03, slideTo = null) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(
          slideTo,
          audioCtx.currentTime + duration
        );
      }

      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
      );

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resetGame() {
      state.mode = "running";
      state.frame = 0;
      state.score = 0;
      state.speed = 3.65;
      state.spawnTimer = 92;
      state.objects.length = 0;
      state.particles.length = 0;
      state.shake = 0;
      state.lastSpawnWasCable = false;
      state.lives = 3;
      state.invincible = 0;
      state.hitFlash = 0;

      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;

      beep(440, .06, "square", .025, 660);
    }

    function jump() {
      ensureAudio();

      if (state.mode === "ready") {
        resetGame();
        player.vy = -12.1;
        player.grounded = false;
        beep(520, .08, "square", .03, 820);
        return;
      }

      if (state.mode === "gameover") {
        resetGame();
        return;
      }

      if (player.grounded) {
        player.vy = -12.1;
        player.grounded = false;
        beep(520, .08, "square", .03, 820);
      }
    }

    function gameOver() {
      if (state.mode !== "running") return;

      state.mode = "gameover";
      state.shake = 10;
      state.best = Math.max(state.best, Math.floor(state.score));
      localStorage.setItem("yulmuRunnerBest", state.best);
      beep(190, .22, "sawtooth", .045, 80);
    }

    function loseLife(hitX, hitY) {
      if (state.invincible > 0 || state.mode !== "running") return;

      state.lives -= 1;
      state.invincible = 92;
      state.hitFlash = 18;
      state.shake = 7;

      burst(hitX, hitY, C.gold, 14);
      burst(hitX, hitY, C.red, 7);

      // 같은 전선 끝부분에 연속으로 걸리지 않도록 살짝 튀기기
      player.vy = -5.2;
      player.grounded = false;

      if (state.lives <= 0) {
        gameOver();
      } else {
        beep(250, .12, "square", .04, 150);
      }
    }

    function spawnObject() {
      // 난이도 완화:
      // 전선 출현률을 낮추고, 전선이 연속으로 등장하지 않게 고정.
      const cableChance = Math.min(.41, .23 + state.score / 1850);
      let makeCable = Math.random() < cableChance;

      if (state.lastSpawnWasCable) makeCable = false;

      if (makeCable) {
        state.objects.push({
          type: "cable",
          x: W + 35,
          y: GROUND_Y - 29,
          w: 66,
          h: 29,
          phase: Math.random() * Math.PI * 2
        });
        state.lastSpawnWasCable = true;
      } else {
        const high = Math.random() < .38;
        state.objects.push({
          type: "seed",
          x: W + 35,
          y: high ? GROUND_Y - 102 : GROUND_Y - 57,
          w: 29,
          h: 38,
          phase: Math.random() * Math.PI * 2,
          collected: false
        });
        state.lastSpawnWasCable = false;
      }

      // 장애물 간격을 넓혀 반응 시간을 확보.
      const speedPenalty = Math.min(20, (state.speed - 3.65) * 5);
      const baseGap = 112 - speedPenalty;
      state.spawnTimer = baseGap + Math.floor(Math.random() * 48);
    }

    function burst(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        state.particles.push({
          x,
          y,
          vx: (Math.random() - .5) * 5,
          vy: -1 - Math.random() * 4,
          life: 28 + Math.random() * 14,
          color,
          size: 2 + Math.floor(Math.random() * 4)
        });
      }
    }

    function intersects(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function update(dt) {
      if (state.shake > 0) state.shake *= .82;
      if (state.invincible > 0) state.invincible = Math.max(0, state.invincible - dt);
      if (state.hitFlash > 0) state.hitFlash = Math.max(0, state.hitFlash - dt);

      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += .18 * dt;
        p.life -= dt;

        if (p.life <= 0) state.particles.splice(i, 1);
      }

      if (state.mode !== "running") return;

      state.frame += dt;
      state.score += .048 * dt;

      // 100점 단위로만 속도가 한 단계씩 증가
      // 0~99점: 3.65
      // 100~199점: 4.20
      // 200~299점: 4.75
      // 300~399점: 5.30 ...
      const speedLevel = Math.floor(state.score / 100);
      state.speed = Math.min(8.60, 3.65 + speedLevel * 0.55);

      // 점프 체공 시간을 조금 늘림.
      player.vy += .56 * dt;
      player.y += player.vy * dt;

      const floorY = GROUND_Y - player.h;
      if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
      }

      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) spawnObject();

      // 율무 충돌 범위를 실제 몸보다 작게 잡아 억울한 충돌 감소.
      const playerHit = {
        x: player.x + 12,
        y: player.y + 8,
        w: player.w - 22,
        h: player.h - 10
      };

      for (let i = state.objects.length - 1; i >= 0; i--) {
        const o = state.objects[i];
        o.x -= state.speed * dt;

        if (o.type === "seed") {
          o.y += Math.sin((state.frame + o.phase * 10) * .08) * .08 * dt;
        }

        if (o.x + o.w < -24) {
          state.objects.splice(i, 1);
          continue;
        }

        if (o.type === "seed") {
          if (intersects(playerHit, o) && !o.collected) {
            o.collected = true;
            state.score += 10;
            burst(o.x + o.w / 2, o.y + o.h / 2, C.gold, 12);
            state.objects.splice(i, 1);
            beep(880, .07, "square", .025, 1320);
          }
          continue;
        }

        // 전선의 판정도 그림보다 조금 작게 설정.
        const cableHit = {
          x: o.x + 8,
          y: o.y + 7,
          w: o.w - 16,
          h: o.h - 7
        };

        if (intersects(playerHit, cableHit) && state.invincible <= 0) {
          loseLife(o.x + o.w / 2, o.y + o.h / 2);
          state.objects.splice(i, 1);
          if (state.mode === "gameover") break;
        }
      }
    }

    function rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
      );
    }

    function text(str, x, y, size, color, align = "left", weight = "900") {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.font = `${weight} ${size}px "Courier New", "Malgun Gothic", monospace`;
      ctx.fillText(str, Math.round(x), Math.round(y));
    }

    function drawBackground() {
      // 위쪽: 하늘색 하늘
      rect(0, 0, W, GROUND_Y, C.sky);

      // 배너와 닮은 하늘색 픽셀 격자
      ctx.globalAlpha = .43;
      for (let x = 0; x <= W; x += 38) rect(x, 0, 3, GROUND_Y, C.skyGrid);
      for (let y = 0; y <= GROUND_Y; y += 38) rect(0, y, W, 3, C.skyGrid);
      ctx.globalAlpha = 1;

      // 뭉툭한 픽셀 구름
      drawCloud(60, 145, 1);
      drawCloud(305, 172, .82);
      drawCloud(620, 136, .95);

      // 배너풍 반짝이
      const stars = [
        [52, 47], [142, 78], [264, 40], [376, 92],
        [518, 50], [654, 83], [744, 37], [712, 145]
      ];
      stars.forEach(([x, y], i) => drawTwinkle(x, y, i % 2 ? 4 : 6));

      // 하늘의 장식용 씨앗
      drawTinySeed(229, 67, -.42);
      drawTinySeed(578, 103, .34);
    }

    function drawCloud(x, y, scale) {
      const s = scale;
      ctx.globalAlpha = .74;
      rect(x, y, 46 * s, 15 * s, C.cloud);
      rect(x + 12 * s, y - 10 * s, 45 * s, 25 * s, C.cloud);
      rect(x + 45 * s, y - 4 * s, 34 * s, 19 * s, C.cloud);
      rect(x + 4 * s, y + 12 * s, 70 * s, 10 * s, C.cream);
      ctx.globalAlpha = 1;
    }

    function drawGround() {
      // 윗부분 잡초
      rect(0, GROUND_Y - 5, W, 7, C.grassDark);

      const grassOffset = -((state.frame * state.speed * .72) % 22);
      for (let x = grassOffset; x < W + 24; x += 22) {
        rect(x, GROUND_Y - 15, 5, 15, C.green);
        rect(x + 5, GROUND_Y - 10, 6, 10, C.green2);
        rect(x + 12, GROUND_Y - 18, 5, 18, C.grassDark);
        rect(x + 16, GROUND_Y - 8, 6, 8, C.green);
      }

      // 바닥: 흙
      rect(0, GROUND_Y + 2, W, H - GROUND_Y, C.soil);
      rect(0, GROUND_Y + 2, W, 7, C.soilLight);
      rect(0, GROUND_Y + 29, W, 5, C.soilDark);
      rect(0, GROUND_Y + 51, W, 4, C.soilLight);

      // 흙 속 자갈 픽셀
      const dirtOffset = -((state.frame * state.speed * .48) % 46);
      for (let x = dirtOffset; x < W + 50; x += 46) {
        rect(x + 4, GROUND_Y + 18, 8, 4, C.soilDark);
        rect(x + 28, GROUND_Y + 42, 10, 5, "#E5B17C");
      }
    }

    function drawTwinkle(x, y, s) {
      rect(x - 1, y - s, 3, s * 2 + 1, C.white);
      rect(x - s, y - 1, s * 2 + 1, 3, C.white);
      rect(x - 2, y - 2, 5, 5, C.white);
    }

    function drawTinySeed(x, y, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      rect(-5, -10, 10, 20, C.brown);
      rect(-2, -8, 4, 16, C.seedLight);
      rect(-1, -6, 2, 12, C.seed);
      ctx.restore();
    }

    function drawHamster() {
      const x = player.x;
      const y = player.y;
      const airborne = !player.grounded;
      const runPhase = Math.floor(state.frame / 4) % 2;
      const bob = player.grounded ? (runPhase ? 1 : -1) : 0;

      ctx.save();
      ctx.translate(0, bob);

      // 피격 후 잠깐 깜빡이는 무적 연출
      if (state.invincible > 0 && Math.floor(state.invincible / 5) % 2 === 0) {
        ctx.globalAlpha = .34;
      }

      if (player.grounded) {
        const savedAlpha = ctx.globalAlpha;
        ctx.globalAlpha = savedAlpha * .24;
        rect(x + 7, GROUND_Y - 5, 76, 7, C.soilDark);
        ctx.globalAlpha = savedAlpha;
      }

      if (state.mode === "running" && player.grounded) {
        rect(x - 26, y + 20, 18, 4, C.brown);
        rect(x - 34, y + 31, 26, 4, C.goldDark);
        rect(x - 20, y + 42, 12, 4, C.pink);
      }

      // 귀
      rect(x + 13, y + 1, 19, 18, C.furShadow);
      rect(x + 17, y + 5, 11, 10, C.pink);
      rect(x + 58, y + 1, 19, 18, C.furShadow);
      rect(x + 62, y + 5, 11, 10, C.pink);

      // 통통한 기본 율무 몸통
      rect(x + 8, y + 12, 70, 39, C.fur);
      rect(x + 2, y + 22, 82, 25, C.fur);
      rect(x + 16, y + 7, 54, 49, C.fur);
      rect(x + 9, y + 42, 68, 13, C.furShadow);

      // 빵빵한 양 볼
      rect(x + 3, y + 22, 27, 26, C.fur);
      rect(x + 58, y + 22, 27, 26, C.fur);
      rect(x + 6, y + 27, 22, 16, C.pinkLight);
      rect(x + 61, y + 27, 21, 16, C.pinkLight);

      // 콩눈, 코, 입
      rect(x + 30, y + 21, 6, 8, C.dark);
      rect(x + 54, y + 21, 6, 8, C.dark);
      rect(x + 43, y + 29, 5, 4, C.pink);
      rect(x + 45, y + 33, 2, 4, C.brown);
      rect(x + 47, y + 35, 5, 3, C.brown);

      // 짧은 앞발
      rect(x + 75, y + 34, 12, 8, C.furShadow);
      rect(x + 82, y + 36, 7, 5, C.pink);

      // 우다다 다리 애니메이션
      const legLiftA = airborne ? 1 : (runPhase ? -5 : 3);
      const legLiftB = airborne ? 1 : (runPhase ? 3 : -5);

      rect(x + 20, y + 50 + legLiftA, 18, 7, C.pink);
      rect(x + 49, y + 50 + legLiftB, 18, 7, C.pink);

      if (state.mode === "running" && player.grounded) {
        const savedAlpha = ctx.globalAlpha;
        ctx.globalAlpha = savedAlpha * .45;
        rect(x + 14, y + 55, 58, 5, C.pink);
        rect(x + 20, y + 60, 46, 3, C.furShadow);
        ctx.globalAlpha = savedAlpha;
      }

      ctx.restore();
    }

    function drawSeed(o) {
      ctx.save();
      ctx.translate(Math.round(o.x + o.w / 2), Math.round(o.y + o.h / 2));
      ctx.rotate(-.45);

      // 검은 외곽선을 더해 하늘에서도 또렷하게 표시
      rect(-11, -18, 22, 36, C.white);
      rect(-9, -16, 18, 32, C.brown);
      rect(-5, -13, 10, 26, C.seedLight);
      rect(-2, -11, 4, 22, C.seed);
      rect(-7, -13, 3, 26, C.seed);
      rect(4, -11, 3, 22, C.seed);
      ctx.restore();
    }

    function drawCable(o) {
      const x = Math.round(o.x);
      const y = Math.round(o.y);

      rect(x + 3, y + o.h - 1, o.w - 3, 5, "rgba(41,47,61,.25)");

      // 짧아진 케이블
      rect(x - 1, y + 8, o.w - 24, 14, C.navy);
      rect(x + 3, y + 11, o.w - 31, 8, C.white);

      rect(x + 9, y + 4, 21, 8, C.navy);
      rect(x + 13, y + 6, 15, 4, C.grey);

      // 갉아먹힌 단면
      rect(x + o.w - 36, y + 8, 14, 14, C.navy);
      rect(x + o.w - 32, y + 11, 9, 8, C.white);
      rect(x + o.w - 36, y + 5, 4, 7, C.red);
      rect(x + o.w - 30, y + 2, 4, 9, C.sky2);
      rect(x + o.w - 24, y + 5, 4, 7, C.gold);

      // 플러그
      rect(x + o.w - 25, y - 1, 24, 25, C.navy);
      rect(x + o.w - 21, y + 3, 17, 17, C.white);
      rect(x + o.w - 18, y + 6, 11, 10, C.grey);
      rect(x + o.w - 1, y + 5, 6, 4, C.navy);
      rect(x + o.w - 1, y + 15, 6, 4, C.navy);

      if (o.x < W - 90 && o.x > player.x + 125) {
        rect(x + 16, y - 23, 17, 17, C.white);
        rect(x + 20, y - 19, 9, 9, C.red);
        text("!", x + 24, y - 14, 15, C.white, "center");
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        rect(p.x, p.y, p.size, p.size, p.color);
      }
      ctx.globalAlpha = 1;
    }

    function drawPixelHeart(x, y, filled = true) {
      const outline = C.brown;
      const fill = filled ? "#FFD84D" : "#746A5D";
      const shine = filled ? "#FFF29A" : "#9B9184";

      rect(x + 4, y, 8, 4, outline);
      rect(x + 20, y, 8, 4, outline);
      rect(x, y + 4, 32, 12, outline);
      rect(x + 4, y + 16, 24, 8, outline);
      rect(x + 8, y + 24, 16, 4, outline);
      rect(x + 12, y + 28, 8, 4, outline);

      rect(x + 5, y + 4, 8, 8, fill);
      rect(x + 19, y + 4, 8, 8, fill);
      rect(x + 4, y + 8, 24, 8, fill);
      rect(x + 8, y + 16, 16, 8, fill);
      rect(x + 12, y + 24, 8, 4, fill);

      rect(x + 7, y + 5, 4, 4, shine);
    }

    function drawHUD() {
      rect(18, 16, 236, 46, C.white);
      rect(22, 20, 228, 38, C.navy);
      rect(26, 24, 220, 30, "#324A70");

      text(
        `SCORE ${String(Math.floor(state.score)).padStart(5, "0")}`,
        34,
        39,
        18,
        C.white
      );

      text(
        `BEST ${String(state.best).padStart(5, "0")}`,
        W / 2,
        37,
        15,
        C.brown,
        "center"
      );

      // 우측 상단 LIFE 패널
      rect(W - 166, 11, 150, 53, C.white);
      rect(W - 162, 15, 142, 45, C.navy);
      text("LIFE", W - 151, 38, 14, C.white);

      for (let i = 0; i < 3; i++) {
        drawPixelHeart(W - 111 + i * 35, 22, i < state.lives);
      }
    }

    function drawHitFlash() {
      if (state.hitFlash <= 0 || state.mode !== "running") return;

      ctx.globalAlpha = Math.min(.24, state.hitFlash / 70);
      rect(0, 0, W, H, C.red);
      ctx.globalAlpha = 1;
    }

    function drawReadyOverlay() {
      ctx.globalAlpha = .94;
      rect(184, 79, 432, 118, C.white);
      ctx.globalAlpha = 1;

      rect(192, 87, 416, 102, C.navy);
      rect(198, 93, 404, 90, "#324A70");

      text("율무 출발 준비!", W / 2, 116, 28, "#FFE060", "center");
      text("[ SPACE / TAP TO START ]", W / 2, 157, 20, C.white, "center");
    }

    function drawGameOverOverlay() {
      ctx.globalAlpha = .72;
      rect(0, 0, W, H, C.red);
      ctx.globalAlpha = 1;

      rect(142, 62, 516, 190, C.white);
      rect(150, 70, 500, 174, C.navy);
      rect(158, 78, 484, 158, "#541D27");

      text("전선 갉아먹다 걸림! 🔌", W / 2, 112, 27, C.white, "center");
      text(
        `SCORE ${Math.floor(state.score)}   BEST ${state.best}`,
        W / 2,
        151,
        17,
        "#FFE477",
        "center"
      );

      rect(
        restartButton.x,
        restartButton.y + 5,
        restartButton.w,
        restartButton.h,
        "#71311E"
      );
      rect(
        restartButton.x,
        restartButton.y,
        restartButton.w,
        restartButton.h,
        C.gold
      );
      rect(
        restartButton.x + 6,
        restartButton.y + 6,
        restartButton.w - 12,
        restartButton.h - 12,
        "#FFF1B5"
      );
      text(
        "[ RESTART ]",
        W / 2,
        restartButton.y + restartButton.h / 2,
        24,
        C.brown,
        "center"
      );
    }

    function render() {
      const sx = state.shake > 0 ? (Math.random() - .5) * state.shake : 0;
      const sy = state.shake > 0 ? (Math.random() - .5) * state.shake : 0;

      ctx.save();
      ctx.translate(sx, sy);

      drawBackground();
      drawGround();

      for (const o of state.objects) {
        if (o.type === "seed") drawSeed(o);
        else drawCable(o);
      }

      drawHamster();
      drawParticles();
      drawHUD();
      drawHitFlash();

      if (state.mode === "ready") drawReadyOverlay();
      if (state.mode === "gameover") drawGameOverOverlay();

      ctx.restore();
    }

    function loop(timestamp) {
      if (!state.lastTime) state.lastTime = timestamp;

      const rawDt = (timestamp - state.lastTime) / 16.6667;
      const dt = Math.min(2.1, Math.max(.4, rawDt || 1));
      state.lastTime = timestamp;

      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function pointerToCanvas(evt) {
      const r = canvas.getBoundingClientRect();
      const point = evt.touches ? evt.touches[0] : evt;

      return {
        x: (point.clientX - r.left) * (W / r.width),
        y: (point.clientY - r.top) * (H / r.height)
      };
    }

    function handlePointer(evt) {
      evt.preventDefault();
      ensureAudio();

      if (state.mode === "gameover") {
        const p = pointerToCanvas(evt);
        const inside =
          p.x >= restartButton.x &&
          p.x <= restartButton.x + restartButton.w &&
          p.y >= restartButton.y &&
          p.y <= restartButton.y + restartButton.h;

        if (inside) resetGame();
        return;
      }

      jump();
    }

    window.addEventListener(
      "keydown",
      (evt) => {
        if (evt.code === "Space") {
          evt.preventDefault();
          jump();
        }
      },
      { passive: false }
    );

    canvas.addEventListener("pointerdown", handlePointer, { passive: false });
    restartA11y.addEventListener("click", resetGame);

    render();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
